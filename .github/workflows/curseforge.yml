# Delegates to the shared workflow suite hosted in ability-core
# (one copy for the whole org). Triggers, permissions and concurrency

name: Publish to CurseForge

# Deliberately separate from release.yml. A CurseForge outage fails only this
# workflow and never the GitHub release.
#
# Mirrors the Modrinth flow (neoforge-mod-template #82 moved both platforms onto
# mc-publish), with one deliberate difference in the channel policy: alphas
# PUBLISH to CurseForge (owner ruling 2026-11-03) while Modrinth keeps them
# GitHub-only. The two secret names are CURSEFORGE_PROJECT_ID and
# CURSEFORGE_API_KEY (an x-api-key header key, not a bearer token).
#
# The release: published trigger is NOT sufficient on its own (GITHUB_TOKEN
# pushes do not cascade), so release.yml dispatches this workflow directly.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    uses: HexaHexes/ability-core/.github/workflows/reusable-curseforge.yml@main
    secrets: inherit
