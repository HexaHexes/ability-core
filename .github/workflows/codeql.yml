name: CodeQL

# CodeQL *advanced setup*: the deterministic engine only, $0 on a public repo.
# Deliberately not GitHub's paid "Code Quality" product, which meters AI credits
# per finding and cannot have its in-PR autofix turned off. It is the `analyze`
# required check; findings live in the Security tab and as PR annotations.
#
# build-mode is manual because moddev's autobuild detection is unreliable on
# NeoForge projects. The step carries PACKAGE_READ_TOKEN so a derived repo
# resolving cross-repo packages still builds on a cold cache.

on:
  pull_request:
  push:
    branches: [ 'neoforge-*' ]   # loader-line branches (org rule); no main/master
  schedule:
    - cron: '27 4 * * 1'   # weekly; off-the-hour minute avoids the cron rush
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF results; explicit blocks zero the rest

concurrency:
  # PRs cancel superseded runs of their own number; pushes cancel older runs of
  # the same ref - ci.yml's keying extended to push events.
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30   # fail fast like every other job: a wedge costs minutes, not 6 hours
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual
          # security + maintainability/reliability queries: the deterministic
          # half of what the Code Quality product used to sell.
          queries: security-and-quality

      - name: Build for extraction
        env:
          # Both names because org repos span two credential-chain generations:
          # modern build.gradle reads PACKAGE_READ_TOKEN first, older ones read
          # GITHUB_TOKEN only; Actions never auto-exports GITHUB_TOKEN. The
          # || github.token fallback keeps the default-token path working for
          # repos where the PAT is not granted (pseudocore-curios junit model).
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || github.token }}
        # --no-build-cache forces javac to run: a FROM-CACHE compileJava runs no
        # compiler and CodeQL fails with "no source code seen during build".
        run: ./gradlew clean assemble --no-build-cache --no-daemon --stacktrace

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4