# Delegates to the shared workflow suite hosted in ability-core
# (one copy for the whole org). Triggers, permissions and concurrency

name: Release

# Runs on pushes to the default branch: when gradle.properties carries a version
# that has no matching v-published release yet, build the jar and publish it as a
# GitHub release for that tag. Everything the mod ships rides inside that jar, so
# there is no separate archive to assemble.
#
# Promoted from tensura-iaf-growth, the org's reference implementation (tracked by
# neoforge-mod-template #4). Two deliberate differences from a mod repo's copy:
#
#   - the jar name is derived from mod_id instead of written out, because this file
#     is copied into repos whose archivesName follows their own mod_id, so a rename
#     needs no edit here;
#   - release bodies are GitHub-native auto-generated changelogs (see
#     .github/release.yml and the changelog ruling in agents/AGENTS.md) - there
#     is no per-repo promo body to edit.
#
# Pre-releases are enabled by default: an -alpha or -beta version publishes on
# the first push that would create it. Set the repository variable
# ALPHA_RELEASES to "false" to opt this repo out (skipped with a log line
# rather than a failure). The default lives in the ${ALPHA_RELEASES:-true}
# expression below - repository variables cannot ship in template content, so
# the file itself must carry the default.

on:
  push:
    branches:
      - main
  # Retry entry for the post-merge version bump: the bump pushes with a PAT
  # whose push cascades into this workflow, so Release normally fires from the
  # bump itself - dispatch here to re-run a Release that failed (e.g. an auth
  # outage) without another push to main.
  workflow_dispatch:

permissions:
  contents: write
  # Dispatching the publishing workflows below needs actions: write - an
  # explicit permissions block zeroes every scope it does not name.
  actions: write
  # Read the ability_core artifact from GitHub Packages so the jar build can
  # resolve it (same scope ci.yml declares; needed for the github.token
  # fallback below - every tensura mod built from this template depends on
  # ability_core, so consumer repos need this on release too).
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: HexaHexes/ability-core/.github/workflows/reusable-release.yml@main
    secrets: inherit
