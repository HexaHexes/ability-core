# Delegates to the shared workflow suite hosted in ability-core
# (one copy for the whole org). Triggers, permissions and concurrency

name: Version Bump

# Opens an isolated version-bump PR on demand.
#
# Separate from Release, which reacts to pushes already on the default branch. This is
# the deliberate act of raising the version, and it produces a PR rather than a commit
# because the version-bump CI check is what decides whether the bump is allowed - a
# workflow that force-pushes would sidestep its own guard.
#
# The PR it opens touches gradle.properties and nothing else, and asserts as much before
# pushing: the same rule CI enforces.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Which part of the version to raise. Ignored once a pre-release train has
          started - the base was chosen when it began.
        type: choice
        required: true
        default: minor
        options:
          - major
          - minor
          - patch
          - none
      channel:
        description: >-
          stable leaves a clean version. beta appends -beta.NN and alpha appends -alpha.NN (two digits, zero-padded), each incrementing while the version stays a pre-release of the
          same base. Alphas are GitHub-only releases (modrinth.yml never publishes
          them).
        type: choice
        required: true
        default: stable
        options:
          - stable
          - beta
          - alpha

permissions:
  contents: write
  pull-requests: write
  # The no-BUMP_PR_TOKEN fallback runs `gh workflow run ci.yml --ref <branch>`;
  # creating a dispatch event requires actions:write on this token, or the step
  # 403s and marks an otherwise successful bump run as failed (issue #94).
  actions: write

# Never cancelled. A branch pushed with no PR open is harder to clean up than a slow run
# is to wait for.

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    uses: HexaHexes/ability-core/.github/workflows/reusable-version-bump.yml@main
    secrets: inherit
